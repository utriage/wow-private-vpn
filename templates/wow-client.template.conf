# ===================================================================
# World of Warcraft US専用 スプリットトンネル WireGuard 設定ファイル
# ===================================================================
# 【セットアップ手順】
# 1. 本設定ファイルを公式WireGuardクライアントにインポートし、「有効化」してください。
# 2. AllowedIPs に指定されたWoW通信のみがVPN経由となり、Discordや通常通信はローカル回線を維持します。
# ===================================================================

[Interface]
Address = <CLIENT_VPN_IP>
PrivateKey = <CLIENT_PRIVATE_KEY>
DNS = 1.1.1.1
MTU = 1380

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
Endpoint = <SERVER_PUBLIC_IP>:51820
PersistentKeepalive = 25

